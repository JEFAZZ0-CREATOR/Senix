<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#03070d">
  <title>SENIX · Inicio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--cyan:#2beaff;--blue:#1688ff;--pink:#fa65d6;--bg:#03070d}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:#effaff;font-family:'Chakra Petch',sans-serif;overflow:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.21;background:linear-gradient(transparent 49.7%,rgba(89,207,255,.065) 50%,transparent 50.3%);background-size:100% 5px;z-index:10}
    .intro{position:relative;display:grid;place-items:center;width:100vw;height:100svh;min-height:520px;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 52%,#071c2d 0,#050d17 32%,#03070d 72%)}
    .intro:before,.intro:after{content:"";position:absolute;inset:0;pointer-events:none}
    .intro:before{z-index:-1;background:radial-gradient(ellipse at center,transparent 10%,rgba(0,0,0,.14) 57%,#020408 100%)}
    .intro:after{opacity:.18;background-image:linear-gradient(rgba(48,163,220,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(48,163,220,.1) 1px,transparent 1px);background-size:68px 68px;mask-image:radial-gradient(ellipse at center,#000,transparent 72%)}
    .horizon{position:absolute;left:50%;top:52%;width:min(84vw,1000px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(13,170,224,.14),rgba(5,76,127,.05) 34%,transparent 67%);filter:blur(22px);pointer-events:none}
    .visual{position:absolute;left:50%;top:48%;width:min(82vw,720px);height:min(82vw,720px);max-height:76vh;transform:translate(-50%,-50%);overflow:visible}
    .visual:after{content:"";position:absolute;z-index:3;left:-15%;top:0;width:130%;height:15%;pointer-events:none;opacity:0;mix-blend-mode:screen;background:linear-gradient(180deg,transparent,rgba(44,225,255,.28) 25%,#ebffff 50%,rgba(44,225,255,.34) 75%,transparent);filter:drop-shadow(0 0 16px #32ddff);transform:translateY(560%)}
    .handoff-ring-hand .visual:after,.handoff-hand-logo .visual:after{animation:holo-bridge .15s steps(3,end) both}
    .handoff-ring-hand .art-ring{filter:brightness(2.4) saturate(1.4) drop-shadow(0 0 30px #2beaff)}
    .handoff-hand-logo .art-hand{filter:brightness(2.3) drop-shadow(0 0 28px rgba(94,237,255,.95))}
    .handoff-hand-logo .hand-outline,.handoff-hand-logo .mesh-lines{stroke-dashoffset:0}
    .handoff-hand-logo .hand-shell,.handoff-hand-logo .mesh-node{opacity:1}
    .art{position:absolute;inset:0;width:100%;height:100%;overflow:visible;opacity:0;transform:scale(.86);filter:drop-shadow(0 0 18px rgba(25,212,255,.4));will-change:opacity,transform}
    .art-ring{color:var(--cyan)} .art-hand{color:#57dfff;transform-box:view-box;transform-origin:50% 50%}
    .stage-ring .art-ring{opacity:1;transform:scale(1);animation:ring-in .38s cubic-bezier(.16,.8,.25,1) both}
    .ring-orbit{transform-box:view-box;transform-origin:350px 350px;animation-timing-function:linear;animation-iteration-count:infinite}
    .ring-orbit-slow{animation-name:orbit-cw;animation-duration:24s}
    .ring-orbit-reverse{animation-name:orbit-ccw;animation-duration:15s}
    .ring-orbit-fast{animation-name:orbit-cw;animation-duration:8s}
    .ring-ticks{transform-box:view-box;transform-origin:350px 350px;animation:orbit-ccw 36s linear infinite}
    .stage-hand .art-hand{opacity:1;transform:scale(1);scale:-1.16 1.16;animation:form-in .42s cubic-bezier(.16,.84,.24,1) both,hand-float 2.4s ease-in-out 1.1s infinite}
    .hand-outline{stroke-dasharray:1;stroke-dashoffset:1}
    .hand-shell{opacity:0;stroke:none}
    .hand-mesh{stroke-linecap:round}
    .mesh-lines{stroke-dasharray:1;stroke-dashoffset:1;opacity:.82}
    .mesh-node{opacity:0;transform-box:fill-box;transform-origin:center;scale:.2}
    .bright-node{filter:url(#handGlow)}
    .stage-hand .hand-outline{animation:draw-outline .72s cubic-bezier(.2,.8,.24,1) .06s forwards}
    .hand-finger-seams path{stroke:rgba(214,251,255,.9);stroke-width:2.3;stroke-linecap:round;fill:none;filter:url(#handGlow);stroke-dasharray:1;stroke-dashoffset:1;opacity:.78}
    .stage-hand .hand-finger-seams path{animation:draw-outline .52s ease .34s forwards}
    .stage-hand .hand-shell{animation:hand-fill .48s ease .7s forwards}
    .stage-hand .mesh-lines{animation:draw-edge .55s var(--edge-delay,0s) cubic-bezier(.22,.7,.24,1) forwards}
    .stage-hand .mesh-node{animation:node-appear .35s var(--node-delay,0s) cubic-bezier(.16,.84,.24,1) forwards}
    .hand-dissolve .art-hand{opacity:0;transform:scale(1.08);filter:brightness(2.4) drop-shadow(0 0 28px rgba(94,237,255,.95));transition:opacity .15s ease,transform .15s ease,filter .15s ease}
    .hand-dissolve .hand-outline,.hand-dissolve .mesh-lines{stroke-dashoffset:0}
    .hand-dissolve .hand-shell,.hand-dissolve .mesh-node{opacity:1}
    .art-ring,.art-hand{transition:opacity .48s ease,filter .3s ease}
    .handoff-ring-hand .art-ring{opacity:0;transition:opacity .15s ease,filter .15s ease}
    .wordmark{position:absolute;left:50%;top:49%;display:flex;align-items:center;justify-content:center;gap:.045em;margin:0;transform:translate(-50%,-50%) scale(.9);opacity:0;white-space:nowrap;font-family:Orbitron,sans-serif;font-weight:800;font-size:clamp(5rem,26vw,20rem);letter-spacing:0;line-height:1;z-index:2;filter:none;transition:opacity .55s ease,transform .65s ease,filter .4s ease}
    .wordmark span{position:relative;display:block;opacity:0;color:transparent;-webkit-text-fill-color:transparent;-webkit-text-stroke:1.5px rgba(133,250,255,.96);text-shadow:0 0 18px rgba(55,226,255,.9);background:none;transform:translateY(22px) rotateX(65deg) scale(.76);filter:blur(8px);transform-origin:50% 65%;}
    .wordmark span::after{content:attr(data-letter);position:absolute;inset:0;opacity:0;color:transparent;-webkit-text-fill-color:transparent;background:linear-gradient(112deg,transparent 35%,rgba(255,255,255,.96) 49%,rgba(131,245,255,.12) 56%,transparent 68%);background-size:240% 100%;background-position:140% 0;background-clip:text;-webkit-background-clip:text;filter:drop-shadow(0 0 8px #8ffaff);pointer-events:none}
    .stage-word .wordmark{opacity:1;transform:translate(-50%,-50%) scale(1)}
    .logo-bloom .wordmark{filter:drop-shadow(0 0 12px rgba(54,224,255,.96)) drop-shadow(0 0 44px rgba(0,156,255,.72))}
    .logo-bloom .wordmark span{filter:drop-shadow(0 0 10px rgba(55,226,255,.95))}
    .stage-word .wordmark span{animation:letter-materialize 1.55s cubic-bezier(.18,.76,.22,1) var(--letter-delay,0s) forwards;}
    .stage-word .wordmark span::after{animation:letter-reflection .7s ease-out var(--shine-delay,1.35s) forwards}
    .logo-bloom .wordmark span::after{animation:letter-reflection .72s ease-out 0s both}
    .wordline{position:absolute;top:calc(49% + clamp(3.6rem,13vw,10rem));left:50%;height:1px;width:min(60vw,560px);transform:translateX(-50%) scaleX(0);opacity:0;background:linear-gradient(90deg,transparent,#25dfff 22%,#d5faff 50%,#25dfff 78%,transparent);box-shadow:0 0 12px #18bff4}
    .stage-word .wordline{animation:line-in .75s ease  .45s forwards}
    .tagline{position:absolute;top:calc(49% + clamp(4.7rem,17vw,12rem));left:50%;transform:translate(-50%,8px);opacity:0;color:#81b9cc;font-size:clamp(.65rem,1.5vw,.9rem);letter-spacing:.48em;text-transform:uppercase;white-space:nowrap;transition:opacity .45s ease}
    .stage-word .tagline{animation:soft-in .65s ease .75s forwards}
    .site-ready .wordmark,.site-ready .wordline,.site-ready .tagline{opacity:0;transform:translate(-50%,-50%) scale(.94);pointer-events:none}
    .web-preview{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translateY(18px);transition:opacity .95s ease,transform 1.1s cubic-bezier(.18,.74,.25,1),visibility 0s linear 1s;z-index:1}
    .site-ready .web-preview{opacity:1;visibility:visible;transform:none;transition-delay:0s}
    .restarting .web-preview{opacity:0!important;visibility:hidden!important;transform:translateY(18px)!important;transition:none!important}
    .site-nav{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(24px,6vw,88px);border-bottom:1px solid rgba(74,194,235,.15);background:rgba(3,9,17,.46);backdrop-filter:blur(14px)}
    .site-brand{font:700 1rem Orbitron,sans-serif;letter-spacing:.2em;color:#b9f6ff}.site-brand b{color:var(--cyan)}
    .site-links{display:flex;gap:clamp(18px,3vw,42px);font-size:.72rem;letter-spacing:.17em;text-transform:uppercase;color:#7598a7}
    .site-status{font-size:.64rem;letter-spacing:.16em;color:#6d9cac}.site-status:before{content:"";display:inline-block;width:6px;height:6px;margin:0 9px 1px 0;border-radius:50%;background:#32f6ca;box-shadow:0 0 10px #32f6ca}
    .site-hero{flex:1;display:grid;place-items:center;text-align:center;padding:80px 24px 130px;background:radial-gradient(ellipse at 50% 55%,rgba(4,110,161,.12),transparent 50%)}
    .hero-copy{max-width:900px}.eyebrow{color:#3cdcf5;font-size:.7rem;letter-spacing:.42em;text-transform:uppercase}.hero-title{font:600 clamp(2.5rem,7vw,6.5rem)/1.04 Orbitron,sans-serif;letter-spacing:-.045em;margin:26px 0 18px}.hero-title span{color:#43dcff;text-shadow:0 0 35px #058cb855}.hero-desc{max-width:570px;margin:0 auto;color:#7d9aa8;font-size:clamp(.9rem,1.5vw,1.1rem);line-height:1.75}.hero-button{display:inline-flex;align-items:center;gap:14px;margin-top:34px;padding:15px 21px;border:1px solid rgba(54,224,255,.45);color:#c8f9ff;font-size:.72rem;letter-spacing:.17em;text-transform:uppercase;background:rgba(5,96,131,.14);box-shadow:inset 0 0 24px #00cfff0d,0 0 28px #00bde515}.hero-button i{font-style:normal;color:var(--cyan)}
    .corner{position:absolute;width:24px;height:24px;opacity:.42;border-color:#32dafa}.corner.tl{left:28px;top:28px;border-left:1px solid;border-top:1px solid}.corner.tr{right:28px;top:28px;border-right:1px solid;border-top:1px solid}.corner.bl{left:28px;bottom:28px;border-left:1px solid;border-bottom:1px solid}.corner.br{right:28px;bottom:28px;border-right:1px solid;border-bottom:1px solid}
    .skip-intro{position:absolute;z-index:20;top:clamp(20px,4vh,36px);right:clamp(52px,5vw,72px);display:inline-flex;align-items:center;gap:11px;min-height:40px;padding:0 15px;border:1px solid rgba(105,231,255,.42);border-radius:999px;background:rgba(5,19,31,.78);backdrop-filter:blur(12px);color:#c3dce4;font:600 .62rem 'Chakra Petch',sans-serif;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:color .2s,border-color .2s,background .2s,box-shadow .2s,transform .2s}
    .skip-intro span{color:#42dff7;font-size:.95rem;transition:transform .2s}
    .skip-intro:hover,.skip-intro:focus-visible{outline:none;color:#e8fbff;border-color:rgba(73,224,255,.7);background:rgba(9,49,69,.82);box-shadow:0 0 24px rgba(35,211,255,.14);transform:translateY(-1px)}
    .skip-intro:hover span{transform:translate(2px,-2px)}
    .skip-intro:focus-visible{box-shadow:0 0 0 3px rgba(70,221,255,.2),0 0 24px rgba(35,211,255,.14)}
    .site-ready .skip-intro,.skip-complete .skip-intro{opacity:0;pointer-events:none;transition:opacity .2s}
    .replay{position:absolute;z-index:4;bottom:28px;left:50%;transform:translateX(-50%);border:0;background:transparent;color:#607d8e;font:500 .63rem 'Chakra Petch',sans-serif;letter-spacing:.24em;text-transform:uppercase;cursor:pointer;opacity:0;pointer-events:none;transition:color .2s,opacity .4s}.stage-word .replay,.site-ready .replay{opacity:.72;pointer-events:auto}.replay:hover{color:#a9f4ff;opacity:1}.replay span{margin-right:8px;color:#3ccee9}
    .progress{position:absolute;left:0;bottom:0;height:2px;width:0;background:linear-gradient(90deg,#135aff,#40f4ff,#f379e6);box-shadow:0 0 10px #2de9ff;z-index:12}.playing .progress{animation:progress 6.05s linear forwards}
    @keyframes ring-in{from{opacity:0;transform:scale(.78)}to{opacity:1;transform:scale(1)}}
    @keyframes orbit-cw{to{transform:rotate(360deg)}}
    @keyframes orbit-ccw{to{transform:rotate(-360deg)}}
    @keyframes holo-bridge{0%{opacity:0;transform:translateY(560%)}25%{opacity:1}60%{opacity:.92;transform:translateY(180%) scaleY(1.4)}100%{opacity:0;transform:translateY(-130%)}}
    @keyframes form-in{0%{opacity:0;transform:scale(.72) rotate(-9deg);filter:blur(8px)}65%{opacity:1;filter:blur(0)}100%{opacity:1;transform:scale(1) rotate(0)}}
    @keyframes hand-float{0%,100%{translate:0 0}50%{translate:0 -8px}}
    @keyframes draw-outline{to{stroke-dashoffset:0}}
    @keyframes draw-edge{to{stroke-dashoffset:0}}
    @keyframes hand-fill{to{opacity:1}}
    @keyframes node-appear{to{opacity:1;scale:1}}
    @keyframes letter-materialize{0%{opacity:0;transform:translateY(22px) rotateX(65deg) scale(.76);filter:blur(8px);-webkit-text-stroke-color:rgba(107,244,255,.75);background:none;text-shadow:none}12%{opacity:0;background:none}18%{opacity:1;transform:translateY(0) rotateX(0) scale(1);filter:blur(0);-webkit-text-stroke-color:#85f7ff;background:none;text-shadow:0 0 3px rgba(41,220,255,.8)}35%{opacity:1;-webkit-text-stroke-color:#aafaff;text-shadow:0 0 5px rgba(41,220,255,.85);background:none}44%{opacity:.72;-webkit-text-stroke-color:#f1ffff;text-shadow:0 0 3px rgba(255,255,255,.7);background:none}50%{opacity:1;-webkit-text-stroke-color:#73ecff;background:none}68%{opacity:1;-webkit-text-stroke-color:#a7fbff;text-shadow:0 0 5px rgba(41,220,255,.9);background:none}73%{opacity:1;-webkit-text-stroke-color:#fff;background:none;text-shadow:0 0 4px rgba(255,255,255,.9)}80%{opacity:1;-webkit-text-stroke-color:transparent;background-image:linear-gradient(180deg,#fff 4%,#d8fbff 30%,#86eaff 53%,#f7ffff 58%,#3ccfff 73%,#d8faff 100%);background-clip:text;-webkit-background-clip:text;text-shadow:none;filter:drop-shadow(0 0 12px rgba(47,221,255,.8))}100%{opacity:1;transform:translateY(0) rotateX(0) scale(1);-webkit-text-stroke-color:transparent;background-image:linear-gradient(180deg,#fff 4%,#c8f7ff 30%,#75dfff 55%,#efffff 58%,#34c5ff 76%,#d8faff 100%);background-clip:text;-webkit-background-clip:text;text-shadow:none;filter:drop-shadow(0 0 13px rgba(47,221,255,.8))}}
    @keyframes letter-reflection{0%{opacity:0;background-position:140% 0}12%{opacity:.95}100%{opacity:0;background-position:-45% 0}}
    @keyframes line-in{to{opacity:.72;transform:translateX(-50%) scaleX(1)}}
    @keyframes soft-in{to{opacity:1;transform:translate(-50%,0)}}
    @keyframes progress{to{width:100%}}
    @media(max-width:650px){.skip-intro{top:18px;right:52px;min-height:36px;padding:0 12px;font-size:.58rem;letter-spacing:.14em}.visual{width:112vw;height:112vw;top:47%}.site-nav{height:64px;padding:0 20px}.site-links{display:none}.site-status{font-size:.56rem}.wordmark{font-size:24vw;gap:.02em}.wordmark span{-webkit-text-stroke-width:1px}.tagline{letter-spacing:.28em}.corner{left:16px!important;right:16px!important}.hero-title{letter-spacing:-.06em}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
  </style>
</head>

      </defs>
      <ellipse cx="530" cy="545" rx="355" ry="390" fill="url(#handAura)"/>
      <path class="hand-shell" d="M376 925C365 880 353 820 344 770L323 674C314 636 300 598 296 562L286 285C285 256 297 239 316 237C339 235 350 250 355 275L378 461L365 132C362 98 375 81 396 79C420 76 438 92 442 118L457 450L477 41C480 8 494 -8 518 -8C542 -8 559 10 560 37L565 453L593 116C597 85 612 69 633 70C656 71 673 88 676 114L652 472C664 466 674 478 684 468C692 454 695 375 697 340C699 308 716 290 740 290C764 290 781 308 783 340L789 430C790 500 746 741 730 750C714 759 699 771 690 790C678 817 668 847 659 869C645 896 623 911 588 923Q482 985 376 925Z" fill="url(#handFill)"/>
      <g class="hand-mesh" id="handMesh" clip-path="url(#handClip)"/>

      <g fill="#fff0ff" filter="url(#handGlow)"><circle cx="299" cy="324" r="7"/><circle cx="382" cy="191" r="7"/><circle cx="508" cy="128" r="8"/><circle cx="629" cy="192" r="7"/><circle cx="430" cy="522" r="8"/><circle cx="560" cy="650" r="8"/><circle cx="695" cy="712" r="7"/><circle cx="560" cy="884" r="6"/></g>
      <path class="hand-outline" pathLength="1" d="M376 925C365 880 353 820 344 770L323 674C314 636 300 598 296 562L286 285C285 256 297 239 316 237C339 235 350 250 355 275L378 461L365 132C362 98 375 81 396 79C420 76 438 92 442 118L457 450L477 41C480 8 494 -8 518 -8C542 -8 559 10 560 37L565 453L593 116C597 85 612 69 633 70C656 71 673 88 676 114L652 472C664 466 674 478 684 468C692 454 695 375 697 340C699 308 716 290 740 290C764 290 781 308 783 340L789 430C790 500 746 741 730 750C714 759 699 771 690 790C678 817 668 847 659 869C645 896 623 911 588 923Q482 985 376 925Z" stroke="url(#handEdge)" stroke-width="5" stroke-linejoin="round" filter="url(#handGlow)"/>
    </svg>

  <h1 class="wordmark" aria-label="SENIX"><span data-letter="S" style="--letter-delay:0s;--shine-delay:1.35s">S</span><span data-letter="E" style="--letter-delay:.14s;--shine-delay:1.49s">E</span><span data-letter="N" style="--letter-delay:.28s;--shine-delay:1.63s">N</span><span data-letter="I" style="--letter-delay:.42s;--shine-delay:1.77s">I</span><span data-letter="X" style="--letter-delay:.56s;--shine-delay:1.91s">X</span></h1><div class="wordline"></div><div class="tagline">Conecta · Aprende · Expresa</div>
  <div class="progress" aria-hidden="true"></div>
</main>
<script>
(() => {
  const intro = document.getElementById('intro');
  let timers = [];
  const skipButton = document.getElementById('skip-intro');
  const skipIntro = () => {
    timers.forEach(clearTimeout); timers = [];
    intro.classList.remove('playing','stage-ring','stage-hand','stage-word','logo-bloom','hand-dissolve','handoff-ring-hand','handoff-hand-logo','restarting');
    intro.classList.add('skip-complete');
    parent.postMessage({type:'senix:intro-complete'}, location.origin);
  };
  skipButton.addEventListener('click', skipIntro);
  const svgNS = 'http://www.w3.org/2000/svg';
  const ringTicks = document.getElementById('ringTicks');
  for(let index=0;index<120;index++) {
    const angle=(index*3-90)*Math.PI/180;
    const major=index%10===0, medium=index%5===0;
    const inner=major?270:medium?274:279, outer=major?298:medium?290:285;
    const tick=document.createElementNS(svgNS,'path');
    const point=(radius)=>[350+Math.cos(angle)*radius,350+Math.sin(angle)*radius];
    const [x1,y1]=point(inner),[x2,y2]=point(outer);
    tick.setAttribute('d',`M${x1.toFixed(2)} ${y1.toFixed(2)}L${x2.toFixed(2)} ${y2.toFixed(2)}`);
    tick.setAttribute('stroke-width',major?'1.7':medium?'1.1':'.7');
    tick.setAttribute('opacity',major?'.95':medium?'.68':'.36');
    ringTicks.appendChild(tick);
  }
  function tessellate(svgSelector, maskId, meshId, bounds, config) {
    const svg = document.querySelector(svgSelector);
    const mask = svg.querySelector(`#${maskId}`);
    const mesh = svg.querySelector(`#${meshId}`);
    const rand = (() => { let seed = config.seed; return () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296); })();
    const inside = (x, y) => { const point = svg.createSVGPoint(); point.x = x; point.y = y; return mask.isPointInFill(point); };
    const points = [];
    const anchors = config.anchors.filter(([x,y]) => inside(x,y));
    points.push(...anchors.map(([x,y]) => ({x,y,anchor:true})));
    let attempts = 0;
    while (points.length < config.count && attempts++ < config.count * 300) {
      const x = bounds.x + rand() * bounds.w;
      const y = bounds.y + rand() * bounds.h;
      if (!inside(x,y) || points.some(point => (point.x-x)**2 + (point.y-y)**2 < config.spacing**2)) continue;
      points.push({x,y,anchor:false});
    }

    const triangulate = source => {
      const p = source.map(point => ({...point}));
      const n = p.length;
      p.push({x:-5000,y:-5000},{x:6000,y:-5000},{x:500,y:6000});
      let triangles = [[n,n+1,n+2]];
      const inCircle = (triangle, point) => {
        const [a,b,c] = triangle.map(index => p[index]);
        const d = 2*(a.x*(b.y-c.y)+b.x*(c.y-a.y)+c.x*(a.y-b.y));
        if (Math.abs(d)<1e-8) return false;
        const aa=a.x*a.x+a.y*a.y, bb=b.x*b.x+b.y*b.y, cc=c.x*c.x+c.y*c.y;
        const ux=(aa*(b.y-c.y)+bb*(c.y-a.y)+cc*(a.y-b.y))/d;
        const uy=(aa*(c.x-b.x)+bb*(a.x-c.x)+cc*(b.x-a.x))/d;
        return (ux-point.x)**2+(uy-point.y)**2 <= (ux-a.x)**2+(uy-a.y)**2+0.01;
      };
      for (let i=0;i<n;i++) {
        const bad=triangles.filter(triangle=>inCircle(triangle,p[i]));
        const edges=[];
        for (const triangle of bad) for (const edge of [[triangle[0],triangle[1]],[triangle[1],triangle[2]],[triangle[2],triangle[0]]]) {
          const key=edge.slice().sort((a,b)=>a-b).join(':');
          const existing=edges.find(item=>item.key===key);
          if(existing) existing.count++; else edges.push({key,edge,count:1});
        }
        triangles=triangles.filter(triangle=>!bad.includes(triangle));
        for(const {edge,count} of edges) if(count===1) triangles.push([edge[0],edge[1],i]);
      }
      return triangles.filter(triangle=>triangle.every(index=>index<n));
    };

    const triangles=triangulate(points);
    const edgeKeys=new Set();
    const edgesToDraw=[];
    for(const triangle of triangles) for(const [a,b] of [[triangle[0],triangle[1]],[triangle[1],triangle[2]],[triangle[2],triangle[0]]]) {
      const key=a<b?`${a}:${b}`:`${b}:${a}`;
      if(edgeKeys.has(key)) continue;
      edgeKeys.add(key); edgesToDraw.push([a,b]);
    }
    edgesToDraw.forEach(([a,b],index)=>{
      const path=document.createElementNS(svgNS,'path');
      path.setAttribute('d',`M${points[a].x.toFixed(1)} ${points[a].y.toFixed(1)}L${points[b].x.toFixed(1)} ${points[b].y.toFixed(1)}`);
      path.setAttribute('pathLength','1'); path.setAttribute('fill','none'); path.setAttribute('stroke','url(#'+config.gradient+')');
      path.setAttribute('stroke-width',config.lineWidth); path.setAttribute('stroke-opacity',config.lineOpacity); path.setAttribute('class','mesh-lines');
      path.style.setProperty('--edge-delay',`${(index*0.0018).toFixed(3)}s`);
      mesh.appendChild(path);
    });
    for(const [index,point] of points.entries()) {
      const dot=document.createElementNS(svgNS,'circle');
      dot.setAttribute('cx',point.x.toFixed(1)); dot.setAttribute('cy',point.y.toFixed(1));
      dot.setAttribute('r',point.anchor?(index%3===0?6:4.3):(1.4+rand()*1.25).toFixed(1));
      dot.setAttribute('fill',point.anchor?'#fff0ff':`url(#${config.gradient})`);
      if(point.anchor) { dot.setAttribute('filter',`url(#${config.glow})`); dot.setAttribute('class','mesh-node bright-node'); }
      else dot.setAttribute('class','mesh-node');
      dot.style.setProperty('--node-delay',`${Math.min(index*0.008,.72).toFixed(3)}s`);
      mesh.appendChild(dot);
    }
  }
  tessellate('.art-hand','handMask','handMesh',{x:250,y:100,w:620,h:845},{seed:71,count:104,spacing:31,gradient:'handEdge',glow:'handGlow',lineWidth:2.8,lineOpacity:.86,anchors:[[303,264],[310,368],[400,105],[413,230],[518,22],[530,205],[632,105],[642,235],,[410,525],[510,545],[590,635],[450,690],[560,770],[510,850],[600,875]]});
  function play() {
    timers.forEach(clearTimeout); timers = [];
    intro.classList.remove('stage-hand','stage-word','site-ready','logo-bloom','hand-dissolve','handoff-ring-hand','handoff-hand-logo');
    intro.classList.add('stage-ring','playing','restarting');
    void intro.offsetWidth;
    timers.push(setTimeout(() => { intro.classList.add('handoff-ring-hand'); }, 1200));
    timers.push(setTimeout(() => { intro.classList.remove('stage-ring','handoff-ring-hand'); intro.classList.add('stage-hand'); }, 1350));
    timers.push(setTimeout(() => { intro.classList.add('handoff-hand-logo'); }, 2550));
    timers.push(setTimeout(() => { intro.classList.remove('stage-hand','handoff-hand-logo'); intro.classList.add('stage-word','hand-dissolve'); }, 2700));
    timers.push(setTimeout(() => { intro.classList.remove('hand-dissolve'); }, 2850));
    timers.push(setTimeout(() => { intro.classList.add('logo-bloom'); }, 4850));
    // La última letra termina de materializarse ~2.1 s después del inicio de la marca; revelamos la web 1.2 s más tarde.
    timers.push(setTimeout(() => { intro.classList.remove('stage-word','restarting'); parent.postMessage({type:'senix:intro-complete'}, location.origin); }, 6050));
    timers.push(setTimeout(() => { intro.classList.remove('playing'); }, 6400));
  }
  play();
})();
</script>
