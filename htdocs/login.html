<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <title>Iniciar sesión — EcoApp</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="auth-wrap">
    <div class="auth-card">
      <a class="auth-back" href="index.html">← Volver al inicio</a>
      <div class="brand" style="margin-bottom:22px;"><span class="brand-mark"></span>EcoApp</div>

      <div class="error-msg" id="errorMsg"></div>

      <form id="loginForm" onsubmit="return handleSubmit(event)">
        <div class="field" id="rowNombre" style="display:none;">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" placeholder="Tu nombre" autocomplete="name" maxlength="80">
        </div>
        <div class="field">
          <label for="email">Correo</label>
          <input type="email" id="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <div class="field" id="rowCodigo" style="display:none;">
          <label for="codigo">Código de registro</label>
          <input type="text" id="codigo" placeholder="Te lo da el equipo" autocomplete="off">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Entrar a EcoApp</button>
        <p class="form-note" style="text-align:center; color:var(--moss); font-size:.82rem; margin-top:14px;">
          <a href="#" id="toggleMode" style="color:inherit; text-decoration:underline;">¿No tienes cuenta? Regístrate</a>
        </p>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let modoRegistro = false;
    const $ = id => document.getElementById(id);

    $("toggleMode").addEventListener("click", e => {
      e.preventDefault();
      modoRegistro = !modoRegistro;
      $("rowNombre").style.display = $("rowCodigo").style.display = modoRegistro ? "block" : "none";
      $("submitBtn").textContent = modoRegistro ? "Crear cuenta" : "Entrar a EcoApp";
      $("toggleMode").textContent = modoRegistro ? "¿Ya tienes cuenta? Inicia sesión" : "¿No tienes cuenta? Regístrate";
      $("password").autocomplete = modoRegistro ? "new-password" : "current-password";
      $("errorMsg").style.display = "none";
    });

    async function handleSubmit(e) {
      e.preventDefault();
      const errorMsg = $("errorMsg"), btn = $("submitBtn");
      errorMsg.style.display = "none";
      btn.disabled = true;
      try {
        const payload = { email: $("email").value.trim(), password: $("password").value };
        if (modoRegistro) { payload.nombre = $("nombre").value.trim(); payload.codigo = $("codigo").value.trim(); }
        const r = await ecoappPost("api/auth.php?action=" + (modoRegistro ? "register" : "login"), payload);
        ecoappSetUser(r.user);
        window.location.href = "menu.html";
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = "block";
        btn.disabled = false;
      }
      return false;
    }
  </script>
</body>

</html>
